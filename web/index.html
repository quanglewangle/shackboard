<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shackboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <section id="map-panel">
    <canvas id="map"></canvas>
    <div id="clocks">
      <div class="clock"><span class="clock-label">UTC</span><span id="clock-utc" class="clock-time">--:--:--</span></div>
      <div class="clock"><span class="clock-label" id="clock-local-label">LOCAL</span><span id="clock-local" class="clock-time">--:--:--</span></div>
    </div>
    <div id="qth-setup">
      <div id="qth-setup-form">
        <label for="callsign-input">Your callsign</label>
        <input id="callsign-input" type="text" placeholder="e.g. G8GDS" autocomplete="off" spellcheck="false">
        <button id="callsign-save">Set</button>
      </div>
      <button id="qth-setup-display" class="hidden">Callsign: <span id="qth-setup-call"></span> (change)</button>
    </div>
  </section>

  <section id="side-panels">
    <div id="propagation-panel" class="panel">
      <h2>Propagation</h2>
      <div id="propagation-body">Loading&hellip;</div>
    </div>

    <div id="spots-panel" class="panel">
      <h2>DX Spots</h2>
      <div id="spots-status"></div>
      <div id="spots-body">Loading&hellip;</div>
    </div>
  </section>

  <div id="callsign-popup" class="hidden">
    <button id="callsign-popup-close">&times;</button>
    <div id="callsign-popup-body"></div>
  </div>

</div>
<script src="js/grayline.js"></script>
<script src="js/map.js"></script>
<script src="js/spacewx.js"></script>
<script src="js/qrz.js"></script>
<script src="js/cluster.js"></script>
<script src="js/app.js"></script>
<!-- build {{BUILD}} -->
</body>
</html>
